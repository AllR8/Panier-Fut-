# Compile l'APK automatiquement à chaque envoi sur GitHub (ou à la demande).
# Le fichier PanierFute-apk.zip apparaît dans l'onglet « Actions » > dernière exécution > Artifacts.
name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # pour publier l'APK sur la page Releases

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est déjà installé sur les machines de GitHub (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4

      # Optionnel : clé de signature fixe, fournie par les secrets du dépôt
      # (PANIER_KEYSTORE_B64 et PANIER_KEYSTORE_PASSWORD). Sans eux, l'APK est
      # signé avec une clé de débogage différente à chaque compilation.
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.PANIER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/panierfute.keystore
          fi

      - name: Compiler
        env:
          PANIER_KEYSTORE_PASSWORD: ${{ secrets.PANIER_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      # En cas d'échec : résume les erreurs en annotations (visibles sur la page de l'exécution).
      - name: Résumé des erreurs
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          esc() { sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          k=$(grep -E "^e: " build.log | head -60 | esc)
          [ -n "$k" ] && echo "::error title=Erreurs Kotlin::$k"
          a=$(grep -iE "AAPT|error: resource|Android resource linking failed|ERROR:" build.log | head -30 | esc)
          [ -n "$a" ] && echo "::error title=Erreurs ressources::$a"
          g=$(awk '/What went wrong/{f=1} f{print} /^\* Try:/{f=0}' build.log | head -60 | esc)
          [ -n "$g" ] && echo "::error title=Gradle::$g"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: PanierFute-apk
          path: app/build/outputs/apk/debug/*.apk

      # Lien direct pour le téléphone :
      # https://github.com/AllR8/Panier-Fut-/releases/latest/download/PanierFute.apk
      - name: Publier l'APK (page Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PanierFute.apk
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version PanierFute.apk \
            --target "$GITHUB_SHA" \
            --title "Panier Futé — dernière version" \
            --notes "APK compilé automatiquement à partir de ${GITHUB_SHA::7}." \
            --latest
